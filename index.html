<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чамд зориулсан урилга ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 32px 26px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.25);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #e91e63; font-size: 26px; margin-bottom: 10px; transition: all 0.2s; }
    p.subtitle { color: #555; font-size: 15px; margin-bottom: 24px; min-height: 22px; }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      min-height: 60px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, font-size 0.2s, padding 0.2s;
    }
    .btn-yes {
      background: #ff4081;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
      z-index: 2;
    }
    .btn-yes:hover { transform: scale(1.06); }
    .btn-no {
      background: #e0e0e0;
      color: #555;
      position: relative;
      z-index: 1;
    }
    .hidden { display: none; }
    .form-section { text-align: left; margin-top: 10px; }
    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin: 14px 0 6px;
      font-size: 14px;
    }
    select, input, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ffc1d6;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff9fb;
    }
    select:focus, input:focus, textarea:focus { border-color: #ff4081; }
    .submit-btn {
      width: 100%;
      margin-top: 22px;
      background: linear-gradient(90deg, #ff4081, #ff758c);
      color: white;
      padding: 14px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1-р хэсэг: Урилга -->
    <div id="invite-screen">
      <h1 id="mainTitle">Надтай болзоонд явах уу? 💖</h1>
      <p class="subtitle" id="subTitle">Чамтай хамт гоё дурсамж бүтээмээр байна ✨</p>
      <div class="btn-group">
        <button class="btn-yes" id="yesBtn" onclick="showForm()">Тэгье, дуртайяа! 🥰</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">Үгүй 😢</button>
      </div>
    </div>

    <!-- 2-р хэсэг: Сонголт хийх форм -->
    <div id="form-screen" class="hidden">
      <h1>Болзоогоо төлөвлөцгөөе 🌹</h1>
      <p class="subtitle">Өөрийнхөө хүссэн сонголтыг хийгээрэй (Шууд над руу очно 😉)</p>

      <!-- ДООРХ МӨРӨНД ӨӨРИЙН ИМЭЙЛ ХАЯГИЙГ БИЧНЭ ҮҮ -->
      <form action="https://formsubmit.co/dawaadalaibayarerdene3@gmail.com" method="POST" class="form-section">
        <input type="hidden" name="_subject" value="❤️ Болзооны урилгын хариу ирлээ!" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />

        <label>1. Хаана уулзах вэ?</label>
        <select name="Хаана_уулзах" required>
          <option value="Тухтай кофе шоп ☕">Тухтай кофе шоп ☕</option>
          <option value="Оройн хоол / Ресторан 🍝">Оройн хоол / Ресторан 🍝</option>
          <option value="Кино театр 🎬">Кино театр 🎬</option>
          <option value="Оройн зугаалга / Парк 🌙">Оройн зугаалга / Парк 🌙</option>
          <option value="Өөр газар (Доор бичнэ)">Өөр газар (Доор бичнэ)</option>
        </select>

        <label>2. Юу идэж уумаар байна?</label>
        <select name="Хоол_сонголт" required>
          <option value="Итали хоол / Паста 🍝">Итали хоол / Паста 🍝</option>
          <option value="Солонгос хоол / BBQ 🥩">Солонгос хоол / BBQ 🥩</option>
          <option value="Суши / Япон хоол 🍣">Суши / Япон хоол 🍣</option>
          <option value="Амттан ба Кофе 🍰">Амттан ба Кофе 🍰</option>
          <option value="Чиний мэдэлд үлдээе 😊">Чиний мэдэлд үлдээе 😊</option>
        </select>

        <label>3. Хэзээ завтай вэ? (Өдөр, цаг)</label>
        <input type="text" name="Хэзээ_уулзах" placeholder="Жишээ нь: Баасан гарагт 19:00 цагаас" required />

        <label>4. Надад хэлэх үг эсвэл хүсэлт байна уу?</label>
        <textarea name="Нэмэлт_хүсэлт" rows="3" placeholder="Хүссэн зүйлээ энд бичээрэй..."></textarea>

        <button type="submit" class="submit-btn">Сонголтоо баталгаажуулах 💌</button>
      </form>
    </div>
  </div>

  <script>
    let noCount = 0;

    const noMessages = [
      "Итгэлтэй байна уу? 🥺",
      "Дахиад нэг бодоод үз дээ 🙏",
      "Арай ч үгүй байлгүй дээ 😭",
      "Гоё болзоо болно оо ✨",
      "Тэгье гээд дарчих л даа 🥹",
      "Би чамайг гомдоохгүй ээ 💖",
      "Сүүлийн боломж шүү! 😂",
      "За за, өөр сонголт байхгүй дээ 🥰"
    ];

    const subMessages = [
      "Нээрээ татгалзах гэж үү? 💔",
      "Амттай хоол авч өгнө шүү 🍝",
      "Хамгийн гоё цагийг хамт өнгөрүүлье 🌹",
      "Үгүй гэдэг товч эвдэрчихсэн юм шиг байна 😆",
      "Улаан товч нь илүү гоё харагдахгүй байна уу? 👉👈"
    ];

    function moveNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const subTitle = document.getElementById('subTitle');

      // Товчны үгийг солих
      noBtn.textContent = noMessages[noCount % noMessages.length];
      
      // Дээд талын тайлбар үгийг солих
      subTitle.textContent = subMessages[noCount % subMessages.length];

      // "Үгүй" товчийг зугтаалгах
      const x = Math.random() * 180 - 90;
      const y = Math.random() * 140 - 70;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      // "Тэгье" товчийг аажмаар томруулах
      noCount++;
      const newFontSize = Math.min(16 + noCount * 2, 28);
      const newPadY = Math.min(12 + noCount * 1.5, 22);
      const newPadX = Math.min(26 + noCount * 3, 44);
      yesBtn.style.fontSize = `${newFontSize}px`;
      yesBtn.style.padding = `${newPadY}px ${newPadX}px`;
    }

    function showForm() {
      document.getElementById('invite-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
