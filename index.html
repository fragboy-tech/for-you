<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чамд зориулсан урилга ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 32px 26px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.25);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #e91e63; font-size: 26px; margin-bottom: 10px; }
    p.subtitle { color: #555; font-size: 15px; margin-bottom: 24px; }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      height: 55px;
      align-items: center;
    }
    button {
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-yes {
      background: #ff4081;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
    }
    .btn-yes:hover { transform: scale(1.06); }
    .btn-no {
      background: #e0e0e0;
      color: #555;
      position: relative;
    }
    .hidden { display: none; }
    .form-section { text-align: left; margin-top: 10px; }
    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin: 14px 0 6px;
      font-size: 14px;
    }
    select, input, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ffc1d6;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff9fb;
    }
    select:focus, input:focus, textarea:focus { border-color: #ff4081; }
    .submit-btn {
      width: 100%;
      margin-top: 22px;
      background: linear-gradient(90deg, #ff4081, #ff758c);
      color: white;
      padding: 14px;
      font-size: 16px;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .success-box { padding: 20px 10px; }
    .success-box h2 { color: #e91e63; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1-р хэсэг: Урилга -->
    <div id="invite-screen">
      <h1>Надтай болзоонд явах уу? 💖</h1>
      <p class="subtitle">Чамтай хамт гоё дурсамж бүтээмээр байна ✨</p>
      <div class="btn-group">
        <button class="btn-yes" onclick="showForm()">Тэгье, дуртайяа! 🥰</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">Үгүй 😢</button>
      </div>
    </div>

    <!-- 2-р хэсэг: Сонголт хийх форм -->
    <div id="form-screen" class="hidden">
      <h1>Болзоогоо төлөвлөцгөөе 🌹</h1>
      <p class="subtitle">Өөрийнхөө хүссэн сонголтыг хийгээрэй (Screenshot хийх шаардлагагүй, шууд над руу очно 😉)</p>

      <form id="dateForm" class="form-section">
        <label>1. Хаана уулзах вэ?</label>
        <select name="Хаана_уулзах" required>
          <option value="Тухтай кофе шоп ☕">Тухтай кофе шоп ☕</option>
          <option value="Оройн хоол / Ресторан 🍝">Оройн хоол / Ресторан 🍝</option>
          <option value="Кино театр 🎬">Кино театр 🎬</option>
          <option value="Оройн зугаалга / Парк 🌙">Оройн зугаалга / Парк 🌙</option>
          <option value="Өөр газар (Доор бичнэ)">Өөр газар (Доор бичнэ)</option>
        </select>

        <label>2. Юу идэж уумаар байна?</label>
        <select name="Хоол_сонголт" required>
          <option value="Итали хоол / Паста 🍝">Итали хоол / Паста 🍝</option>
          <option value="Солонгос хоол / BBQ 🥩">Солонгос хоол / BBQ 🥩</option>
          <option value="Суши / Япон хоол 🍣">Суши / Япон хоол 🍣</option>
          <option value="Амттан ба Кофе 🍰">Амттан ба Кофе 🍰</option>
          <option value="Чиний мэдэлд үлдээе 😊">Чиний мэдэлд үлдээе 😊</option>
        </select>

        <label>3. Хэзээ завтай вэ? (Өдөр, цаг)</label>
        <input type="text" name="Хэзээ_уулзах" placeholder="Жишээ нь: Баасан гарагт 19:00 цагаас" required />

        <label>4. Надад хэлэх үг эсвэл хүсэлт байна уу?</label>
        <textarea name="Нэмэлт_хүсэлт" rows="3" placeholder="Хүссэн зүйлээ энд бичээрэй..."></textarea>

        <button type="submit" class="submit-btn" id="submitBtn">Сонголтоо баталгаажуулах 💌</button>
      </form>
    </div>

    <!-- 3-р хэсэг: Амжилттай илгээгдсэн -->
    <div id="success-screen" class="hidden success-box">
      <h2>Баярлалаа хайрт минь! ❤️</h2>
      <p>Чиний сонголтууд над руу амжилттай илгээгдлээ. Удахгүй уулзъя! 🥰</p>
    </div>
  </div>

  <script>
    // ЭНД ӨӨРИЙН ИМЭЙЛ ХАЯГИЙГ БИЧНЭ ҮҮ:
    const MY_EMAIL = "dawaadalaibayrerdene3@gmail.com";

    function moveNo() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * 180 - 90;
      const y = Math.random() * 140 - 70;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function showForm() {
      document.getElementById('invite-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');
    }

    const form = document.getElementById('dateForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Илгээж байна... ⏳";

      const formData = new FormData(form);
      const data = Object.fromEntries(formData);
      data._subject = "❤️ Болзооны урилгын хариу ирлээ!";
      data._captcha = "false";

      try {
        const response = await fetch(`https://formsubmit.co/ajax/${MY_EMAIL}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.success === "true" || result.success === true) {
          document.getElementById('form-screen').classList.add('hidden');
          document.getElementById('success-screen').classList.remove('hidden');
        } else {
          alert("Алдаа гарлаа. Имэйл хаягаа зөв бичсэн эсэхийг шалгана уу!");
          submitBtn.disabled = false;
          submitBtn.textContent = "Сонголтоо баталгаажуулах 💌";
        }
      } catch (error) {
        alert("Интернэт холболтоо шалгаад дахин оролдоно уу.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Сонголтоо баталгаажуулах 💌";
      }
    });
  </script>
</body>
</html>
